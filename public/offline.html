<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أنت غير متصل بالإنترنت - ساعتي التفاعلية</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 3px solid #fde68a;
    }
    .icon {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 20px;
      display: block;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #b45309;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #d97706;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 16px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #b45309;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">⏰📶</span>
    <h1>أنت تعمل بدون اتصال بالإنترنت</h1>
    <p>تطبيق «ساعتي التفاعلية» يدعم العمل في وضع عدم الاتصال. بمجرد عودة الاتصال ستتمكن من تحميل أي تحديثات جديدة.</p>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة 🔄</button>
  </div>
</body>
</html>
