<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Clock Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Dial Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Hand Shadow -->
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="99" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Clock Outer Base with Shadow -->
  <circle cx="256" cy="256" r="190" fill="#fed7aa" filter="url(#dropShadow)" />
  <circle cx="256" cy="256" r="180" fill="url(#rimGrad)" stroke="#fbbf24" stroke-width="8" />

  <!-- Decorative Sparkles / Stars -->
  <path d="M100 80 Q105 100 125 105 Q105 110 100 130 Q95 110 75 105 Q95 100 100 80 Z" fill="#ffffff" opacity="0.9" />
  <path d="M420 90 Q424 105 440 108 Q424 112 420 128 Q416 112 400 108 Q416 105 420 90 Z" fill="#ffffff" opacity="0.9" />

  <!-- Clock Dial Numbers (Arabic Digits for Kids) -->
  <!-- 12 -->
  <text x="256" y="125" font-family="'Tajawal', 'Fredoka', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#1e293b" text-anchor="middle">12</text>
  <!-- 3 -->
  <text x="390" y="267" font-family="'Tajawal', 'Fredoka', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#1e293b" text-anchor="middle">3</text>
  <!-- 6 -->
  <text x="256" y="410" font-family="'Tajawal', 'Fredoka', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#1e293b" text-anchor="middle">6</text>
  <!-- 9 -->
  <text x="122" y="267" font-family="'Tajawal', 'Fredoka', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#1e293b" text-anchor="middle">9</text>

  <!-- Hour Dots for 1, 2, 4, 5, 7, 8, 10, 11 -->
  <!-- 1 (30 deg) -->
  <circle cx="328" cy="132" r="6" fill="#64748b" />
  <!-- 2 (60 deg) -->
  <circle cx="380" cy="184" r="6" fill="#64748b" />
  <!-- 4 (120 deg) -->
  <circle cx="380" cy="328" r="6" fill="#64748b" />
  <!-- 5 (150 deg) -->
  <circle cx="328" cy="380" r="6" fill="#64748b" />
  <!-- 7 (210 deg) -->
  <circle cx="184" cy="380" r="6" fill="#64748b" />
  <!-- 8 (240 deg) -->
  <circle cx="132" cy="328" r="6" fill="#64748b" />
  <!-- 10 (300 deg) -->
  <circle cx="132" cy="184" r="6" fill="#64748b" />
  <!-- 11 (330 deg) -->
  <circle cx="184" cy="132" r="6" fill="#64748b" />

  <!-- Clock Hands (10:10 - The friendly smiling clock!) -->
  
  <!-- Hour Hand: Red (pointing at 10 o'clock - angle ~300 deg) -->
  <!-- Center is 256, 256. Angle 300 deg => dx = cos(300)*R = 0.5*R, dy = sin(300)*R = -0.866*R. For length 95: dx = -47.5, dy = -82.2 -->
  <g filter="url(#handShadow)">
    <line x1="256" y1="256" x2="175" y2="155" stroke="#dc2626" stroke-width="16" stroke-linecap="round" />
    <circle cx="175" cy="155" r="4" fill="#ef4444" />
  </g>

  <!-- Minute Hand: Blue (pointing at 2 o'clock - angle ~60 deg) -->
  <!-- For length 135: dx = cos(60)*135 = 67.5, dy = sin(60)*135 = -116.9 => x = 345, y = 125 -->
  <g filter="url(#handShadow)">
    <line x1="256" y1="256" x2="345" y2="125" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />
    <circle cx="345" cy="125" r="3" fill="#38bdf8" />
  </g>

  <!-- Center Hub with Shiny Layers -->
  <circle cx="256" cy="256" r="20" fill="#d97706" />
  <circle cx="256" cy="256" r="14" fill="#fbbf24" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>
